name: Lighthouse CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Lighthouse perf thresholds are aspirational (Section-10 §H10).
    # Treat the audit as informational until the platform consistently
    # clears them — failing every PR on perf regressions a single CSS
    # tweak can introduce is noise, not signal.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --legacy-peer-deps matches the main CI workflow; without it npm ci
      # bails on the wagmi/viem peer-dep mismatch we've already accepted.
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Install Lighthouse
        run: npm install --no-save --legacy-peer-deps lighthouse chrome-launcher
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_SUPPRESS_TURBOPACK_WARNING: '1'
      - name: Start server
        run: |
          npx next start -p 5000 &
          npx wait-on http://localhost:5000 -t 60000
      - name: Lighthouse audit
        run: node scripts/lighthouse-ci.mjs
        env:
          # Script reads NAKA_LIGHTHOUSE_BASE_URL — previous workflow
          # set LIGHTHOUSE_BASE_URL which was silently ignored.
          NAKA_LIGHTHOUSE_BASE_URL: http://localhost:5000
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: |
            lighthouse-results/
            lighthouse-report.html
          if-no-files-found: ignore
